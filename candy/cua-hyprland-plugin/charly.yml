#  cua-hyprland-plugin — the OPT-IN, ABI-PINNED Hyprland isolated-input plugin.
#
#  Cua Driver's isolated BACKGROUND input (typing/clicking an app without touching the
#  user's focus or pointer) needs a native Hyprland plugin, built for the EXACT Hyprland
#  version the guest runs AND with the same C++ compiler family/version that built
#  Hyprland (C++ objects cross the plugin API). It is DISABLED by default and is NOT part
#  of the portable driver install — measured on the Cua Omarchy Fleet image (spike S1/S5),
#  where it ships as the locally-built package `cua-hyprland-plugin 0.26.1-1` pinned to
#  Hyprland 0.56.2.
#
#  WHY A SEPARATE OPT-IN CANDY: the plugin has no stable ABI. Loading a mismatched build
#  is refused by Hyprland (or worse). A guest that upgrades Hyprland MUST rebuild this
#  plugin. So it is deliberately NOT pulled in by `cua-driver`/`cua-session`; a bed or box
#  that wants isolated input composes it explicitly and accepts the coupling.
#
#  THIS CANDY builds the plugin from the pinned cua source against the Hyprland headers
#  the guest already ships, and asserts the built module's ABI matches at runtime
#  (`hyprctl -j cua:status` reports `abi.match:true`) — failing closed on a mismatch.
#  On a distro whose Hyprland headers are not installable, the candy SKIPS the build
#  (the portable driver still works without it).
version: 2026.261.1747
cua-hyprland-plugin:
    candy:
        version: 2026.261.1747
        description: |
            The OPT-IN, ABI-pinned Cua Driver Hyprland plugin for isolated background
            input — built for the exact Hyprland version/toolchain the guest runs. It is
            deliberately NOT a dependency of cua-driver/cua-session: the plugin has no
            stable ABI and must be rebuilt on every Hyprland upgrade, so only a bed or box
            that wants isolated input composes it. Built from the pinned trycua/cua source
            against the guest's Hyprland headers, and fail-closed at load (the plugin's own
            ABI hash must match the compositor's). Verifiable on the built image: the .so
            exists and the Hyprland config loads it.
        require:
            - cua-driver
        distro:
            arch:
                package:
                    - cmake
                    - ninja
                    - git
                    # Hyprland's headers for the exact installed compositor version: on
                    # Arch this is the hyprland package itself (which ships the headers).
                    - hyprland
        plan:
            - run: build the Cua Hyprland plugin from the pinned source against the guest's Hyprland (ABI-pinned; skipped where Hyprland headers are absent)
              run_as: root
              command: |
                  set -eu
                  # A guest without a Hyprland toolchain (a non-Hyprland desktop, or a base
                  # without headers) SKIPS: the portable driver works without isolated input.
                  if ! command -v hyprland >/dev/null 2>&1 && ! pkg-config --exists hyprland 2>/dev/null; then
                    echo "no Hyprland headers — skipping the opt-in plugin build (the portable driver still works)"
                    exit 0
                  fi
                  if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
                    echo "cmake/ninja absent — skipping the opt-in plugin build"
                    exit 0
                  fi
                  src=/tmp/cua-hyprland-plugin-src
                  rm -rf "$src"
                  git clone --depth 1 --branch cua-driver-rs-v0.29.1 https://github.com/trycua/cua "$src"
                  cd "$src/libs/cua-driver/hyprland-plugin"
                  # The exact Hyprland pkg-config version the guest ships — the build
                  # refuses a different header version (fail-closed).
                  hv="$(pkg-config --modversion hyprland 2>/dev/null || echo '')"
                  args="-G Ninja -DCMAKE_BUILD_TYPE=Release -DCUA_HYPRLAND_INPUT=ON"
                  if [ -n "$hv" ]; then args="$args -DCUA_HYPRLAND_EXPECTED_VERSION=$hv"; fi
                  # shellcheck disable=SC2086
                  cmake -S . -B build $args
                  cmake --build build
                  mkdir -p /usr/lib/cua/hyprland
                  install -m 0755 build/cua-hyprland-plugin.so /usr/lib/cua/hyprland/cua-hyprland-plugin.so
                  rm -rf "$src"

            - run: load the plugin from the desktop user's Hyprland config (last, so the qualified layout is explicit)
              run_as: root
              command: |
                  set -eu
                  if [ ! -f /usr/lib/cua/hyprland/cua-hyprland-plugin.so ]; then
                    echo "plugin not built (skipped) — no Hyprland config edit"
                    exit 0
                  fi
                  # Hyprland's modern config is Lua (Omarchy 4.x). Write an image-owned
                  # include that loads the plugin and enables its transport, with the
                  # evdev/pc105/us keymap the qualified build expects.
                  u="$(getent passwd 1000 | cut -d: -f1)"
                  test -n "$u"
                  hd="/home/$u/.config/hypr"
                  mkdir -p "$hd"
                  cat > "$hd/cua-plugin.lua" <<'LUA'
                  -- Image-owned opt-in. The package itself never enables or loads the plugin.
                  -- Keep this include last so the qualified layout and neutral locks are explicit.
                  hl.plugin.load("/usr/lib/cua/hyprland/cua-hyprland-plugin.so")
                  hl.config({
                    plugin = {cua = {enabled = true}},
                    input = {kb_rules = "evdev", kb_model = "pc105", kb_layout = "us",
                             kb_variant = "", kb_options = "", kb_file = "", numlock_by_default = false}
                  })
                  LUA
                  chown "$u:$u" "$hd/cua-plugin.lua" 2>/dev/null || true

            - check: the opt-in plugin ships its load config, and the .so is present when the guest has Hyprland
              id: cua-hyprland-plugin-artifacts
              context:
                - build
              exit_status: 0
              command: |
                  set -eu
                  # The candy is a no-op on a non-Hyprland guest; assert conditionally.
                  if pkg-config --exists hyprland 2>/dev/null || command -v hyprland >/dev/null 2>&1; then
                    test -f /usr/lib/cua/hyprland/cua-hyprland-plugin.so || { echo "Hyprland present but plugin .so missing" >&2; exit 1; }
                  fi
                  echo "cua-hyprland-plugin artifacts checked"
