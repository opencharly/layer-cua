#  opencharly/layer-cua — Cua Driver (trycua/cua) on a live desktop, as charly candies.
#
#  SHAPE: one repo, one external pin per member under candy/<name>/.
#
#  Cua Driver is the background computer-use driver that drives a desktop's apps via the
#  accessibility (AT-SPI) tree and input, plus window enumeration and screenshots. These
#  candies install the driver, run it as a desktop-session daemon, expose the
#  computer-server HTTP/MCP surface, and — opt-in — build the ABI-pinned Hyprland plugin
#  for isolated background input. They compose onto any desktop VM/pod (the check beds in
#  opencharly/distro-omarchy compose them onto the Omarchy VM).
#
#  The driver is a USER-SESSION daemon: it needs WAYLAND_DISPLAY, XDG_RUNTIME_DIR,
#  DBUS_SESSION_BUS_ADDRESS and the AT-SPI bus, which only exist once a graphical session
#  is up. Every service member therefore declares a systemd USER unit gated on
#  graphical-session.target (the same wiring the Cua Omarchy Fleet image ships).
repo: github.com/opencharly/layer-cua
defaults:
    platform:
        - linux/amd64
discover:
    - path: candy
      recursive: true

#  A build bed proving the driver candy installs cleanly on an Arch base: the pinned
#  release extracts, the aux files stay together, the symlink resolves, and the driver
#  prints a version. `disposable: true` authorizes teardown; the base is the arch box.
check-cua-driver-box:
    pod:
        image: cua-driver-test
        disposable: true
        lifecycle: dev
        description: >-
            Proves the cua-driver candy installs the pinned Cua Driver release with its
            aux files together and a working symlink on an Arch base, and that the
            cua-session candy writes + enables its graphical-session user units.
        plan:
            - check: the driver binary and its aux files are present together
              id: layer-cua-driver-files
              context: [runtime]
              command:
                  command: |
                      set -eu
                      for f in cua-driver cua-cursor-theme libcua_driver_sdk.so; do
                        test -e "/opt/cua-driver/$f"
                      done
                      test -x /usr/local/bin/cua-driver
            - check: the driver runs and prints a version through the symlink
              id: layer-cua-driver-version
              context: [runtime]
              command:
                  command: cua-driver --version
              stdout:
                  - matches: '[0-9]+\.[0-9]+\.[0-9]+'
            - check: the session units are installed and enabled on graphical-session.target
              id: layer-cua-session-units
              context: [runtime]
              file:
                  file: /etc/systemd/user/graphical-session.target.wants/cua-driver.service
                  exists: true
            - check: the uinput udev rule is installed
              id: layer-cua-uinput
              context: [runtime]
              file:
                  file: /etc/udev/rules.d/99-cua-uinput.rules
                  contains:
                      - 'GROUP="input"'
cua-driver-test:
    candy:
        description: minimal Arch box composing the layer-cua driver + session + guest candies
        base: quay.io/archlinux/archlinux:base-20260719.0.558306
        build:
            - pac
        distro:
            - arch
        candy:
            - cua-driver
            - cua-session
            - cua-guest

# cua-hyprland-plugin-test — the IN-REPO bed that COMPOSES the opt-in plugin candy, so its
# plan (the plugin BUILD + the "load it from the Hyprland config" run step) and its checks
# execute against a real build, not a hand-typed equivalent. The base is Arch with the
# Hyprland package (which ships the headers the plugin builds against).
#
# The candy's load step APPENDS `require("hypr.cua-plugin")` to an EXISTING
# ~/.config/hypr/hyprland.lua (the Omarchy Lua config). A plain Arch base has none, so the
# fixture candy below seeds a minimal Omarchy-shaped hyprland.lua FIRST; the plugin candy
# then REQUIRES it, so the order is guaranteed and the changed append branch actually runs.
cua-hyprland-fixture:
    candy:
        description: test-only fixture seeding a minimal Omarchy-shaped ~/.config/hypr/hyprland.lua so the opt-in plugin candy's config-wiring step has a real config to append to
        distro:
            arch:
                package:
                    - bash
        plan:
            - run: seed a minimal Omarchy-shaped Hyprland Lua config the plugin candy can append to
              run_as: root
              command: |
                  set -eu
                  u="$(getent passwd 1000 | cut -d: -f1)"
                  test -n "$u"
                  hd="/home/$u/.config/hypr"
                  mkdir -p "$hd"
                  # Shaped like Omarchy's: a dofile bootstrap + a FIXED require() list, so the
                  # plugin candy's append has something realistic to extend.
                  cat > "$hd/hyprland.lua" <<'LUA'
                  -- Minimal Omarchy-shaped fixture (test-only).
                  require("default.hypr.omarchy")
                  require("hypr.monitors")
                  require("hypr.input")
                  LUA
                  chown -R "$u:$u" "$hd"
            - check: the seeded Hyprland Lua config exists and carries the require()-list shape
              id: cua-hyprland-fixture-seeded
              context:
                - build
              exit_status: 0
              command: |
                  set -eu
                  u="$(getent passwd 1000 | cut -d: -f1)"
                  hl="/home/$u/.config/hypr/hyprland.lua"
                  test -f "$hl" || { echo "fixture hyprland.lua missing" >&2; exit 1; }
                  grep -q 'require("default.hypr.omarchy")' "$hl" || { echo "fixture not Omarchy-shaped" >&2; exit 1; }
                  echo "fixture hyprland.lua seeded"
cua-hyprland-plugin-test:
    candy:
        description: Arch box composing the opt-in cua-hyprland-plugin candy (builds the ABI-pinned plugin + wires it into the Hyprland config), over a fixture that provides the Omarchy-shaped config
        base: quay.io/archlinux/archlinux:base-20260719.0.558306
        build:
            - pac
        distro:
            - arch
        candy:
            - cua-hyprland-fixture
            - cua-hyprland-plugin
